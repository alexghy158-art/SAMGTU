# Сайт — статика из папки site/ (без сборки). Функция напоминаний — netlify/functions/.
[build]
  publish = "site"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# JS/CSS/данные всегда проверяются на свежесть, чтобы после пуша сразу видеть новую версию.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker должен обновляться сразу после деплоя.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
