<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трекер СамГТУ</title></head>
<body><p style="font-family:system-ui;text-align:center;margin-top:25vh;color:#456">Загрузка трекера…</p>
<script>
(async()=>{
  let s='';
  for(let i=0;i<12;i++){
    const r=await fetch('b'+i,{cache:'no-store'});
    if(!r.ok) throw new Error('part '+i);
    s+=await r.text();
  }
  document.open();document.write(s);document.close();
})().catch(e=>{document.body.innerHTML='<p style="color:#c00;text-align:center">'+e+'</p>';});
</script></body></html>
