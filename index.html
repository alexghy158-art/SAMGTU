<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Загрузка…</title>
</head>
<body style="font-family:system-ui;display:grid;place-items:center;min-height:100vh;margin:0;background:#f4f5f7;color:#111">
<p id="s">Загрузка приложения…</p>
<script>
(async function(){
  const n = 7;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = await fetch('c' + i + '.txt');
    if (!r.ok) throw new Error('chunk ' + i);
    parts.push(await r.text());
  }
  const html = parts.join('');
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.getElementById('s').textContent = 'Ошибка загрузки: ' + e.message;
});
</script>
</body>
</html>
